apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 30m
  chart:
    spec:
      chart: jellyfin
      version: 2.7.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values: |
    replicaCount: 1

    image:
      pullPolicy: IfNotPresent

    persistence:
      cache:
        enabled: true
        size: 25Gi
        storageClass: 'zfs-local-dataset'
      config:
        enabled: true
        size: 5Gi
        storageClass: 'zfs-local-dataset'
      media:
        enabled: true
        hostPath: '/tank/media'

    ingress:
      enabled: false

    service:
      type: LoadBalancer
      port: 8096


    nodeSelector: {}
    tolerations: []
    affinity: {}
