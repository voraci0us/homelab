apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-image-server-nginx
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;

      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-image-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vm-image-server
  template:
    metadata:
      labels:
        app: vm-image-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: images
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: images
          hostPath:
            path: /fast/vm-images
            type: Directory
        - name: nginx-config
          configMap:
            name: vm-image-server-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: vm-image-server
spec:
  selector:
    app: vm-image-server
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP