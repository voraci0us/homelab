apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-values
  namespace: immich
data:
  values.yaml: |
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.7.5
            env:
              DB_HOSTNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: host
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: user
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password
              DB_DATABASE_NAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: dbname

    immich:
      configuration:
        oauth:
          enabled: true
          clientId: immich
          issuerUrl: http://linus:30900/application/o/immich/.well-known/openid-configuration
          scope: openid email profile
          autoRegister: true
          autoLaunch: false
          buttonText: Login with Authentik
      persistence:
        library:
          existingClaim: immich-library

    server:
      service:
        main:
          type: NodePort
          ports:
            http:
              nodePort: 30283

    valkey:
      enabled: true
