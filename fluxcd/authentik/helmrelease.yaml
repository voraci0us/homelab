apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      envFrom:
        - secretRef:
            name: authentik-config
          
    authentik:
      secret_key: "env://SECRET_KEY"
      error_reporting:
        enabled: false
      postgresql: 
        password: "env://POSTGRESQL_PASSWORD"

    server:
      replicas: 1
      ingress:
        enabled: false

    worker:
      replicas: 1

    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-postgresql