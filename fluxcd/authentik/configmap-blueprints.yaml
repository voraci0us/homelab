apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  jellyfin.yaml: |
    version: 1
    entries:
      - model: authentik_core.group
        attrs:
          attributes: {}
          is_superuser: false
          parents: []
          roles: []
        conditions: []
        identifiers:
          name: JellyfinUsers
        permissions: []
        state: present

      - model: authentik_rbac.role
        id: role-ldapsearch
        identifiers:
          name: LDAP Search
        attrs:
          name: LDAP Search
        state: present

      - model: authentik_core.user
        identifiers:
          username: jellyfin-bind
        attrs:
          username: jellyfin-bind
          name: jellyfin-bind
          path: goauthentik.io/service-accounts
          type: service_account
          roles:
            - !KeyOf role-ldapsearch
        state: present

      - model: authentik_providers_ldap.ldapprovider
        attrs:
          authentication_flow: null
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          base_dn: DC=ldap,DC=goauthentik,DC=io
          bind_mode: direct
          certificate: null
          gid_start_number: 4000
          mfa_support: false
          name: Provider for Jellyfin
          property_mappings: []
          search_mode: direct
          tls_server_name: ''
          uid_start_number: 2000
        conditions: []
        identifiers:
          name: Provider for Jellyfin
        id: provider-ldap
        permissions:
          - permission: authentik_providers_ldap.search_full_directory
            role: !KeyOf role-ldapsearch
        state: present

      - model: authentik_core.application
        attrs:
          name: Jellyfin
          policy_engine_mode: any
          provider: !KeyOf provider-ldap
          slug: jellyfin
        conditions: []
        id: application-jellyfin
        identifiers:
          slug: jellyfin
        permissions: []
        state: present

      - model: authentik_outposts.outpost
        attrs:
          config:
            authentik_host: http://authentik-server.authentik.svc.cluster.local
          providers:
          - !KeyOf provider-ldap
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          type: ldap
        conditions: []
        identifiers:
          name: LDAP
        permissions: []
        state: present

  immich.yaml: |
    version: 1
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-immich
        identifiers:
          name: Provider for Immich
        attrs:
          name: Provider for Immich
          client_id: immich
          client_type: public
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          redirect_uris:
            - url: "app.immich:///oauth-callback"
              matching_mode: strict
            - url: "http://linus:30283/auth/login"
              matching_mode: strict
            - url: "http://linus:30283/user-settings"
              matching_mode: strict
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        state: present

      - model: authentik_core.application
        id: application-immich
        identifiers:
          slug: immich
        attrs:
          name: Immich
          slug: immich
          provider: !KeyOf provider-immich
          policy_engine_mode: any
          meta_launch_url: "http://linus:30283/auth/login?autoLaunch=1"
        state: present

      - model: authentik_core.group
        id: group-immich-users
        identifiers:
          name: ImmichUsers
        attrs:
          name: ImmichUsers
        state: present

      - model: authentik_policies.policybinding
        identifiers:
          pk: 7b424aa3-df85-4c5d-b732-e1c676b4044b
        attrs:
          enabled: true
          failure_result: false
          group: !KeyOf group-immich-users
          negate: false
          order: 0
          policy: null
          target: !KeyOf application-immich
          timeout: 30
          user: null
        state: present