apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  jellyfin.yaml: |
    version: 1
    entries:
      - model: authentik_core.group
        attrs:
          attributes: {}
          is_superuser: false
          parents: []
          roles: []
        conditions: []
        identifiers:
          name: JellyfinUsers
        permissions: []
        state: present

      - model: authentik_rbac.role
        id: role-ldapsearch
        identifiers:
          name: LDAP Search
        attrs:
          name: LDAP Search
        state: present

      - model: authentik_core.user
        identifiers:
          username: jellyfin-bind
        attrs:
          username: jellyfin-bind
          name: jellyfin-bind
          path: goauthentik.io/service-accounts
          type: service_account
          roles:
            - !KeyOf role-ldapsearch
        state: present

      - model: authentik_providers_ldap.ldapprovider
        attrs:
          authentication_flow: null
          authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          base_dn: DC=ldap,DC=goauthentik,DC=io
          bind_mode: direct
          certificate: null
          gid_start_number: 4000
          mfa_support: false
          name: Provider for Jellyfin
          property_mappings: []
          search_mode: direct
          tls_server_name: ''
          uid_start_number: 2000
        conditions: []
        identifiers:
          name: Provider for Jellyfin
        id: provider-ldap
        permissions:
          - permission: authentik_providers_ldap.search_full_directory
            role: !KeyOf role-ldapsearch
        state: present

      - model: authentik_core.application
        attrs:
          name: Jellyfin
          policy_engine_mode: any
          provider: !KeyOf provider-ldap
          slug: jellyfin
        conditions: []
        id: application-jellyfin
        identifiers:
          slug: jellyfin
        permissions: []
        state: present

      - model: authentik_outposts.outpost
        attrs:
          config:
            authentik_host: http://authentik-server.authentik.svc.cluster.local
          providers:
          - !KeyOf provider-ldap
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          type: ldap
        conditions: []
        identifiers:
          name: LDAP
        permissions: []
        state: present